            ]
        };

        const gradeColors = {
            "入門": "rgb(255, 182, 193)",
            "8-6級": "rgb(255, 165, 0)",
            "5級": "rgb(255, 255, 255)",
            "4級": "rgb(255, 255, 0)",
            "3級": "rgb(0, 128, 0)",
            "2級": "rgb(255, 0, 0)"
        };

        const monthOrder = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月", "上半期", "下半期", "年間"];

        function createChart(gradeData) {
            const grade = gradeData.grade;
            const ctx = document.getElementById(`chart-${grade}`);
            if (!ctx) return;

            const monthlyData = gradeData.monthly_info;
            const displayData = [];
            const actualData = [];

            monthlyData.forEach(item => {
                if (item.top_rate === null) {
                    displayData.push(null);
                } else if (item.top_rate === 0 && item.boulder_count >= 1) {
                    displayData.push(0.4);
                } else {
                    displayData.push(item.top_rate);
                }
                actualData.push(item);
            });

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthOrder,
                    datasets: [{
                        label: `${grade} Top Rate (%)`,
                        data: displayData,
                        backgroundColor: gradeColors[grade] || 'rgb(128, 128, 128)',
                        borderColor: grade === "5級" ? 'rgb(200, 200, 200)' : gradeColors[grade] || 'rgb(128, 128, 128)',
                        borderWidth: grade === "5級" ? 2 : 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: {
                                display: true,
                                text: 'Top Rate (%)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Month'
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            enabled: true,
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: function(context) {
                                    return context[0].label;
                                },
                                label: function(context) {
                                    const index = context.dataIndex;
                                    if (index >= 0 && index < actualData.length) {
                                        const item = actualData[index];
                                        if (item.top_rate === null) {
                                            return [];
                                        }
                                        return [
                                            `Top Rate: ${item.top_rate}%`,
                                            `Boulder Count: ${item.boulder_count}`,
                                            `Top Count: ${item.top_count}`
                                        ];
                                    }
                                    return [];
                                }
                            }
                        },
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        data.result_info.forEach(gradeData => {
            createChart(gradeData);
        });
