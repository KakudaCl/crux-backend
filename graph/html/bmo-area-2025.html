<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMO Area 2025 - Top Rate by Area</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }
        .chart-container {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
            text-align: center;
        }
        canvas {
            max-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMO Area 2025 - Top Rate by Area</h1>
        <div id="charts"></div>
    </div>

    <script>
        const data = {"result_info":[{"grade":"入門","area_info":[{"area_name":"A-Wall","top_rate":100.0,"boulder_count":8,"top_count":8},{"area_name":"B-Wall","top_rate":null,"boulder_count":0,"top_count":0},{"area_name":"C-Wall","top_rate":100.0,"boulder_count":5,"top_count":5},{"area_name":"D-Wall","top_rate":100.0,"boulder_count":5,"top_count":5},{"area_name":"E-Wall","top_rate":100.0,"boulder_count":6,"top_count":6},{"area_name":"F-Wall","top_rate":100.0,"boulder_count":5,"top_count":5}]},{"grade":"8-6級","area_info":[{"area_name":"A-Wall","top_rate":100.0,"boulder_count":5,"top_count":5},{"area_name":"B-Wall","top_rate":100.0,"boulder_count":7,"top_count":7},{"area_name":"C-Wall","top_rate":100.0,"boulder_count":9,"top_count":9},{"area_name":"D-Wall","top_rate":100.0,"boulder_count":10,"top_count":10},{"area_name":"E-Wall","top_rate":100.0,"boulder_count":5,"top_count":5},{"area_name":"F-Wall","top_rate":100.0,"boulder_count":6,"top_count":6}]},{"grade":"5級","area_info":[{"area_name":"A-Wall","top_rate":100.0,"boulder_count":8,"top_count":8},{"area_name":"B-Wall","top_rate":87.5,"boulder_count":8,"top_count":7},{"area_name":"C-Wall","top_rate":80.0,"boulder_count":10,"top_count":8},{"area_name":"D-Wall","top_rate":100.0,"boulder_count":9,"top_count":9},{"area_name":"E-Wall","top_rate":100.0,"boulder_count":8,"top_count":8},{"area_name":"F-Wall","top_rate":85.71,"boulder_count":7,"top_count":6}]},{"grade":"4級","area_info":[{"area_name":"A-Wall","top_rate":66.67,"boulder_count":6,"top_count":4},{"area_name":"B-Wall","top_rate":100.0,"boulder_count":1,"top_count":1},{"area_name":"C-Wall","top_rate":87.5,"boulder_count":8,"top_count":7},{"area_name":"D-Wall","top_rate":80.0,"boulder_count":5,"top_count":4},{"area_name":"E-Wall","top_rate":80.0,"boulder_count":5,"top_count":4},{"area_name":"F-Wall","top_rate":0.0,"boulder_count":5,"top_count":0}]},{"grade":"3級","area_info":[{"area_name":"A-Wall","top_rate":20.0,"boulder_count":5,"top_count":1},{"area_name":"B-Wall","top_rate":null,"boulder_count":0,"top_count":0},{"area_name":"C-Wall","top_rate":0.0,"boulder_count":1,"top_count":0},{"area_name":"D-Wall","top_rate":0.0,"boulder_count":1,"top_count":0},{"area_name":"E-Wall","top_rate":null,"boulder_count":0,"top_count":0},{"area_name":"F-Wall","top_rate":0.0,"boulder_count":3,"top_count":0}]}]};

        const gradeColors = {
            "入門": "rgb(255, 182, 193)",
            "8-6級": "rgb(255, 165, 0)",
            "5級": "rgb(255, 255, 255)",
            "4級": "rgb(255, 255, 0)",
            "3級": "rgb(0, 128, 0)",
            "2級": "rgb(255, 0, 0)"
        };

        function renderCharts(chartData) {
            const container = document.getElementById('charts');
            chartData.result_info.forEach((gradeData, index) => {
                const grade = gradeData.grade;
                const safeId = `chart-area-${index}-${grade.replace(/\s+/g, '-')}`;
                const div = document.createElement('div');
                div.className = 'chart-container';
                div.innerHTML = `<div class="chart-title">${grade}</div><canvas id="${safeId}"></canvas>`;
                container.appendChild(div);

                const areaInfo = gradeData.area_info || [];
                const labels = areaInfo.map(a => a.area_name);
                const displayData = [];
                areaInfo.forEach(item => {
                    if (item.top_rate === null) {
                        displayData.push(null);
                    } else if (item.top_rate === 0 && item.boulder_count >= 1) {
                        displayData.push(0.4);
                    } else {
                        displayData.push(item.top_rate);
                    }
                });

                const ctx = document.getElementById(safeId);
                if (!ctx) return;

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `${grade} Top Rate (%)`,
                            data: displayData,
                            backgroundColor: gradeColors[grade] || 'rgb(128, 128, 128)',
                            borderColor: grade === "5級" ? 'rgb(200, 200, 200)' : gradeColors[grade] || 'rgb(128, 128, 128)',
                            borderWidth: grade === "5級" ? 2 : 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                title: { display: true, text: 'Top Rate (%)' }
                            },
                            x: {
                                title: { display: true, text: 'Area' }
                            }
                        },
                        plugins: {
                            tooltip: {
                                enabled: true,
                                mode: 'index',
                                intersect: false,
                                callbacks: {
                                    title: function(context) {
                                        return context[0].label;
                                    },
                                    label: function(context) {
                                        const idx = context.dataIndex;
                                        const item = areaInfo[idx];
                                        if (!item || item.top_rate === null) return [];
                                        return [
                                            `Top Rate: ${item.top_rate}%`,
                                            `Boulder Count: ${item.boulder_count}`,
                                            `Top Count: ${item.top_count}`
                                        ];
                                    }
                                }
                            },
                            legend: { display: false }
                        }
                    }
                });
            });
        }

        renderCharts(data);
    </script>
</body>
</html>
